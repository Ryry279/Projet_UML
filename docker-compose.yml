version: '3.8'

services:
  # Service pour le backend
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: mypassword
      DB_NAME: musculation_db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  # Service pour la base de données
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: musculation_db
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- NOUVEAU SERVICE POUR LE FRONTEND ---
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      # Synchronise notre code local avec le conteneur pour voir les changements en direct
      - ./frontend:/app
    stdin_open: true # Permet au serveur de développement de rester actif
    tty: true

volumes:
  mysql-data: